[project]
name = "tqdaemon"
version = "0.9.0"
description = "Local resource-aware task queue daemon (CLI, web UI, MCP, remote workers)"
license = "MIT"
readme = "README.md"
authors = [{ name = "tqdaemon contributors" }]
keywords = [
    "task-queue",
    "job-scheduler",
    "mcp",
    "daemon",
    "gpu",
    "yaml",
    "resource-management",
    "local-first",
    "ai-agents",
    "cli",
    "web-ui",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    # The import remains ``pynvml``; nvidia-ml-py is its maintained distribution.
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
toast = ["winotify>=1.1.0"]

[project.urls]
Homepage = "https://github.com/wwylon/tqdaemon"
Repository = "https://github.com/wwylon/tqdaemon"
Issues = "https://github.com/wwylon/tqdaemon/issues"
Documentation = "https://github.com/wwylon/tqdaemon/tree/main/docs"

[project.scripts]
tq = "tqdaemon.cli:main"
tqdaemon = "tqdaemon.cli:main"

[dependency-groups]
browser = [
    "playwright>=1.64",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-xdist>=3.5",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Gradual: worker core first (Wave 6 / F-209). Expand modules as annotations land.
files = [
    "tqdaemon/set_caps.py",
    "tqdaemon/worker_http.py",
    "tqdaemon/worker_outbox.py",
    "tqdaemon/worker_journal.py",
    "tqdaemon/daemon_clock.py",
    "tqdaemon/mutate.py",
    "tqdaemon/arg_overrides.py",
    "tqdaemon/statuses.py",
    "tqdaemon/admit_context.py",
    "tqdaemon/stop_summary.py",
    "tqdaemon/doctor_checks.py",
    "tqdaemon/lease.py",
    "tqdaemon/stop_reasons.py",
    "tqdaemon/netutil.py",
    "tqdaemon/yaml_sync.py",
    "tqdaemon/system_alerts.py",
    "tqdaemon/deprefs.py",
    "tqdaemon/errors.py",
    "tqdaemon/dt_utils.py",
    "tqdaemon/_time.py",
    "tqdaemon/jsonutil.py",
    "tqdaemon/victim.py",
    "tqdaemon/placement.py",
    "tqdaemon/why.py",
    "tqdaemon/run_diff.py",
    "tqdaemon/timeline_forecast.py",
    "tqdaemon/progress_sanity.py",
    "tqdaemon/adopt.py",
    "tqdaemon/run_wrapper.py",
    "tqdaemon/backoff.py",
    "tqdaemon/dbtxn.py",
    "tqdaemon/submit.py",
    "tqdaemon/mutations.py",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tqdaemon"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "tqdaemon/_docs"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PERF", "S110", "BLE001"]
ignore = [
    "E501",   # line too long (handled by formatter separately)
    "SIM118", # `k in row.keys()` is required for sqlite3.Row (`k in row` tests values)
    "SIM105", # try/except/pass with a narrow exception is fine; S110 bans it for `except Exception`
    # BLE001: catch what can actually happen; a deliberate boundary catch says why in `# noqa: BLE001 - <reason>`
    "SIM102", # nested ifs often carry a comment per condition
    "SIM108", # ternaries only where they read better
    "SIM103", # guard-clause chains ending in `return True` read better than one boolean
    "SIM113", # manual counters that outlive the loop
    "SIM115", # long-lived handles (run logs, child stdout) outlive any `with`
    "B905",   # zip(strict=) where it matters, not everywhere
    "UP031",  # %-format in a few log/SQL builders
    "PERF401",# comprehension vs loop is a readability call
    "E402",   # module import not at top (deferred imports throughout)
    "E702",   # compact `x = a; i += 2` argument-loop style
]

[tool.ruff.lint.per-file-ignores]
# Intentional star imports of the _cli_* command modules.
"tqdaemon/cli.py" = ["F401", "F403", "F405", "F811"]
# Re-export hubs: names are imported here so other modules (and tests) import them from one place.
"tqdaemon/db.py" = ["F401"]
"tqdaemon/web/__init__.py" = ["F401"]
"tqdaemon/web/deps.py" = ["F401"]
# Tests and scripts may swallow cleanup errors in teardown.
"tests/**" = ["S110", "BLE001"]
# Lambdas are called inside the same loop iteration by timed().
"scripts/bench_scale.py" = ["B023"]
"scripts/**" = ["S110", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
markers = [
    "stress: optional slow/heavy fixtures (not run in default CI)",
    "slow: >5 s each (process-table scans, compilers, large fixtures); skip with -m 'not slow' for a quick run",
    "nightly: scale and high-rate edge cases (not run in fast/full CI)",
    "js: web UI tests that run JavaScript under node (auto-applied to tests/test_js_*.py); -m 'not js' for a quick Python loop",
]

[tool.coverage.run]
branch = true
source = ["tqdaemon"]
omit = ["tqdaemon/_docs/*"]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
