[project]
name = "taskqueue"
version = "0.7.5"
description = "Local resource-aware task queue daemon (CLI, web UI, MCP, remote workers)"
license = "MIT"
readme = "README.md"
authors = [{ name = "taskqueue contributors" }]
keywords = ["task-queue", "scheduler", "mcp", "daemon"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    # The import remains ``pynvml``; nvidia-ml-py is its maintained distribution.
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
toast = ["winotify>=1.1.0"]

[project.urls]
Homepage = "https://github.com/wwylon/taskqueue"
Repository = "https://github.com/wwylon/taskqueue"
Issues = "https://github.com/wwylon/taskqueue/issues"
Documentation = "https://github.com/wwylon/taskqueue/tree/main/docs"

[project.scripts]
tq = "taskqueue.cli:main"
taskqueue = "taskqueue.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Gradual: worker core first (Wave 6 / F-209). Expand modules as annotations land.
files = [
    "taskqueue/worker_http.py",
    "taskqueue/worker_outbox.py",
    "taskqueue/worker_journal.py",
    "taskqueue/daemon_clock.py",
    "taskqueue/mutate.py",
    "taskqueue/arg_overrides.py",
    "taskqueue/statuses.py",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskqueue"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "taskqueue/_docs"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (handled by formatter separately)
    "F401",   # imported but unused (star imports in cli.py are intentional)
    "F403",   # star import
    "F811",   # redefinition from star import
    "E402",   # module import not at top (deferred imports throughout)
    "F405",   # names from the intentional star imports in cli.py
    "I001",   # import order: not enforced yet (one mechanical reformat pending)
    "E702",   # compact `x = a; i += 2` argument-loop style
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
markers = [
    "stress: optional slow/heavy fixtures (not run in default CI)",
    "slow: >5 s each (process-table scans, compilers, large fixtures); skip with -m 'not slow' for a quick run",
    "nightly: scale and high-rate edge cases (not run in fast/full CI)",
]
