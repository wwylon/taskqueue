# CI POSTPONED 2026-08-28 — GitHub Actions billing / spending limit exhausted.
# Auto triggers removed so this does not burn Actions minutes.
# Manual `workflow_dispatch` kept for optional resume after billing is restored.
# F-209: single source of truth is scripts/ci.ps1 (local + Actions).
# See plan/CI_POSTPONED.md.

name: ci

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "CI suite"
        required: true
        default: fast
        type: choice
        options: [fast, full, nightly]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: inputs.suite != 'fast'
        with:
          node-version: "22"
      - name: Sync (locked)
        run: uv sync --locked --group dev
      - name: Run scripts/ci.ps1
        shell: pwsh
        # F-209 / deep-audit: one source of truth — including nightly (was a divergent subset).
        run: pwsh scripts/ci.ps1 -Mode "${{ inputs.suite }}"
